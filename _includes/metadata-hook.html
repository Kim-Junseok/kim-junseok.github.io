<!-- Academicons for Google Scholar icon -->
<link rel="stylesheet" href="{{ '/assets/vendor/academicons/css/academicons.min.css' | relative_url }}">

<style>
  #sidebar .sidebar-bottom #mode-toggle {
    margin-right: 0.8rem;
  }

  @media (min-width: 1650px) {
    #sidebar .sidebar-bottom #mode-toggle {
      margin-right: 1rem;
    }
  }

  .home-intro-figure {
    margin: 1.25rem 0 1.5rem;
  }

  .home-intro-image {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 0.5rem;
    box-shadow: var(--sidebar-border-color) 0 0 0 1px;
  }

  .home-intro-figure .preview-img,
  .home-intro-figure .preview-img:not(.no-bg) {
    background: transparent;
  }

  .home-intro-figure .shimmer::before {
    content: none;
    animation: none;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var button = document.getElementById('mode-toggle');

    if (!button) {
      return;
    }

    var html = document.documentElement;
    var modes = ['auto', 'light', 'dark'];
    var labels = {
      auto: 'Theme mode: Auto',
      light: 'Theme mode: Light',
      dark: 'Theme mode: Dark'
    };
    var icons = {
      auto: 'fas fa-desktop',
      light: 'fas fa-sun',
      dark: 'fas fa-moon'
    };

    function getSessionMode() {
      try {
        return sessionStorage.getItem('mode');
      } catch (error) {
        return null;
      }
    }

    function setSessionMode(mode) {
      try {
        if (mode === 'auto') {
          sessionStorage.removeItem('mode');
        } else {
          sessionStorage.setItem('mode', mode);
        }
      } catch (error) {
        return;
      }
    }

    function currentMode() {
      var storedMode = getSessionMode() || html.getAttribute('data-mode');
      return storedMode === 'light' || storedMode === 'dark' ? storedMode : 'auto';
    }

    function updateButton(mode) {
      var icon = button.querySelector('i');

      if (icon) {
        icon.className = icons[mode];
      }

      button.setAttribute('aria-label', labels[mode]);
      button.setAttribute('title', labels[mode]);
      button.setAttribute('data-theme-mode', mode);
    }

    function applyMode(mode) {
      if (mode === 'auto') {
        html.removeAttribute('data-mode');
      } else {
        html.setAttribute('data-mode', mode);
      }

      setSessionMode(mode);
      updateButton(mode);
      window.postMessage({ id: 'theme-mode' }, '*');
    }

    button.addEventListener(
      'click',
      function (event) {
        var mode = currentMode();
        var nextMode = modes[(modes.indexOf(mode) + 1) % modes.length];

        event.preventDefault();
        event.stopImmediatePropagation();
        applyMode(nextMode);
      },
      true
    );

    updateButton(currentMode());
  });
</script>
