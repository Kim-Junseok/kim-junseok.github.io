theme: jekyll-theme-chirpy

lang: en
timezone: UTC

title: Junseok Kim
tagline: Cellular Protocol Firmware Engineer
description: >-
  Personal site and technical blog for publications, wireless systems,
  and future posts on topics such as Sionna and O-RAN.

url: "https://kim-junseok.github.io"
baseurl: ""

github:
  username: Kim-Junseok

social:
  name: Junseok Kim
  email: ""
  links:
    - https://www.linkedin.com/in/junsk
    - https://scholar.google.com/citations?user=mJTAhlgAAAAJ&hl=en
    - https://github.com/Kim-Junseok

theme_mode: 

plugins:
  - jekyll-include-cache

exclude:
  - build_check.py
  - docs/
  - .venv/
  - "*.code-workspace"

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
