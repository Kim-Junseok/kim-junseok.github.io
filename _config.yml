theme: jekyll-theme-chirpy

lang: en
timezone: UTC

title: Junseok Kim
tagline: "Cellular Protocol Firmware Engineer<br>Samsung Electronics"
description: >-
  Personal site and technical blog for publications, wireless systems,
  and future posts on topics such as Sionna and O-RAN.

url: "https://kim-junseok.github.io"
baseurl: ""

github:
  username: Kim-Junseok

social:
  name: Junseok Kim
  email: ""
  links:
    - https://www.linkedin.com/in/junsk
    - https://scholar.google.com/citations?user=mJTAhlgAAAAJ&hl=en
    - https://github.com/Kim-Junseok

theme_mode: 

plugins:
  - jekyll-archives
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 10

jekyll-archives:
  # "categories" and "category" are plugin keys; the public label is Topics.
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /topics/:name/
    tag: /tags/:name/

exclude:
  - requirements.py
  - docs/
  - .venv/
  - .bundle/
  - vendor/
  - "*.code-workspace"

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
